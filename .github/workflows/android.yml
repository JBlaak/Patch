name: Android

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Android Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests and snapshots
        run: ./gradlew :patch:testDebugUnitTest :patch:verifyPaparazziDebug :patch:assembleRelease
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-failures
          path: android/patch/build/paparazzi/failures
